services:
  # ----------------------------------------------------
  # Service 1: PostgreSQL + pgvector Database
  # ----------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg17
    container_name: techqa_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------
  # Service 2: FastAPI Backend Engine
  # ----------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: techqa_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      DB_HOST: postgres
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PORT: 5432
      GROQ_API_KEY: ${GROQ_API_KEY}
      LITELLM_MODEL: ${LITELLM_MODEL}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  pgdata:
    driver: local
